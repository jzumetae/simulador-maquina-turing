<!doctype html>
<html lang="es">
  <head>

    <!-- Fuentes: Libre Baskerville (textos) y JetBrains Mono (números binarios) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400&display=swap"

    />

    <!-- Estilos de la cinta grande y de los integrantes -->
  <style>
  .definicion--solo-cinta {
    display: flex;
    justify-content: center;
    padding: 62px 32px 40px;
  }

  .definicion--solo-cinta .definicion__cinta {
    width: auto;
    margin: 0;
    padding: 0;
    border: none;
  }

  .definicion--solo-cinta .cinta {
    --tam-celda: 68px;
    --sep-celda: 6px;
    position: relative;
    width: calc(var(--tam-celda) * 6 + var(--sep-celda) * 5) !important;
    height: var(--tam-celda) !important;
    margin: 0 auto;
    padding: 0 !important;
    border: none !important;
    background: none !important;
  }

  /* Rieles punteados */
  .definicion--solo-cinta .cinta::before,
  .definicion--solo-cinta .cinta::after {
    content: "" !important;
    position: absolute !important;
    left: -56px !important;
    right: -56px !important;
    width: auto !important;
    height: 8px !important;
    border: none !important;
    background: radial-gradient(
        circle,
        rgba(213, 226, 236, 0.6) 1.5px,
        transparent 2px
      )
      0 50% / 17px 8px !important;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  }

  .definicion--solo-cinta .cinta::before {
    top: -14px !important;
    bottom: auto !important;
  }

  .definicion--solo-cinta .cinta::after {
    top: auto !important;
    bottom: -14px !important;
  }

  .definicion--solo-cinta .cinta__celdas {
    display: flex !important;
    width: 100% !important;
    height: 100% !important;
    gap: var(--sep-celda) !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    background: none !important;
  }

  .definicion--solo-cinta .cinta__celdas::before,
  .definicion--solo-cinta .cinta__celdas::after {
    display: none !important;
  }

  .definicion--solo-cinta .cinta__celdas span {
    display: flex !important;
    flex: 0 0 var(--tam-celda) !important;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: var(--tam-celda) !important;
    min-width: var(--tam-celda) !important;
    height: var(--tam-celda) !important;
    padding: 0 !important;
    font-family: "JetBrains Mono", monospace !important;
    font-size: 28px !important;
    font-weight: 400 !important;
    line-height: 1 !important;
    color: #e6f0f7 !important;
    background: rgba(255, 255, 255, 0.07) !important;
    border: 1px solid rgba(213, 226, 236, 0.35) !important;
    border-radius: 7px !important;
  }

  .definicion--solo-cinta .cinta__celdas span.activa {
    color: #0d2c47 !important;
    background: #ffffff !important;
    border-color: #ffffff !important;
    box-shadow: 0 0 18px rgba(165, 214, 245, 0.7) !important;
  }

  /* Flecha del cabezal */
  .definicion--solo-cinta .cinta__cabezal {
    position: absolute !important;
    top: -34px !important;
    left: calc(
      var(--pos) * (var(--tam-celda) + var(--sep-celda)) + var(--tam-celda) / 2
    ) !important;
    right: auto !important;
    width: 0 !important;
    height: 0 !important;
    margin: 0 !important;
    background: none !important;
    clip-path: none !important;
    border-left: 9px solid transparent !important;
    border-right: 9px solid transparent !important;
    border-top: 12px solid #bfe3f8 !important;
    border-bottom: none !important;
    transform: translateX(-50%) !important;
  }

  .definicion--solo-cinta .cinta__cabezal::before,
  .definicion--solo-cinta .cinta__cabezal::after {
    display: none !important;
  }

  /* Integrantes */
  .integrantes {
    margin: 24px 0 0;
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.7;
    color: #1e486a;
  }

  .integrantes span {
    margin: 0 8px;
    color: #7f9cb4;
  }

  /* Pantallas pequeñas */
  @media (max-width: 560px) {
    .definicion--solo-cinta {
      padding: 54px 12px 32px;
    }

    .definicion--solo-cinta .cinta {
      --tam-celda: 40px;
      --sep-celda: 4px;
    }

    .definicion--solo-cinta .cinta::before,
    .definicion--solo-cinta .cinta::after {
      left: -8px !important;
      right: -8px !important;
    }

    .definicion--solo-cinta .cinta__celdas span {
      font-size: 18px !important;
    }
  }
  /* Ocultar el botón Salir y sus líneas */
.pie {
  display: none !important;
}
</style>
  </head>

    <!-- ===================== CONTENIDO ===================== -->
    <main class="menu">
      <header class="encabezado">
        <p class="encabezado__sup">
          <span class="linea"></span>
          <span>Simulador</span>
          <span class="linea"></span>
        </p>
        <h1 class="titulo">Máquina de Turing</h1>
      </header>

      <!-- Tarjeta con la cinta grande -->
      <section
        class="tarjeta definicion definicion--solo-cinta"
        aria-label="Cinta de la Máquina de Turing"
      >
        <div class="definicion__cinta">
          <div class="cinta" id="cinta" style="--pos: 2">
            <span class="cinta__cabezal"></span>
            <div class="cinta__celdas">
              <span>B</span><span>0</span><span class="activa">1</span
              ><span>1</span><span>0</span><span>B</span>
            </div>
          </div>
        </div>
      </section>

      <h2 class="separador"><span>Selecciona el modo de ejecución</span></h2>

      <!-- Modos de ejecución -->
      <div class="modos">
        <button
          type="button"
          class="tarjeta modo modo--auto"
          data-modo="automatico"
        >
          <span class="modo__icono">
            <!-- Ícono "settings" de Lucide (licencia ISC) -->
            <svg viewBox="0 0 24 24">
              <path
                d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </span>
          <span class="modo__titulo">Ejecución<br />automática</span>
          <span class="modo__divisor"></span>
          <span class="modo__desc"
            >La máquina ejecuta las transiciones por sí sola.</span
          >
          <span class="modo__flecha">
            <svg viewBox="0 0 24 24">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </span>
        </button>

        <button
          type="button"
          class="tarjeta modo modo--manual"
          data-modo="manual"
        >
          <span class="modo__icono">
            <!-- Ícono "pointer" de Lucide (licencia ISC) -->
            <svg viewBox="0 0 24 24">
              <path d="M22 14a8 8 0 0 1-8 8" />
              <path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
              <path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1" />
              <path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10" />
              <path
                d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"
              />
            </svg>
          </span>
          <span class="modo__titulo">Ejecución<br />manual</span>
          <span class="modo__divisor"></span>
          <span class="modo__desc"
            >La máquina lee, escribe y mueve el cabezal paso a paso.</span
          >
          <span class="modo__flecha">
            <svg viewBox="0 0 24 24">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </span>
        </button>
      </div>

      <!-- Integrantes -->
      <p class="integrantes">
        Daniela Paredes <span>|</span> Astrid Chiguichón <span>|</span>
        Karla Téllez <span>|</span> José Zumeta
      </p>

      <!-- Salir -->
      <div class="pie">
        <span class="linea"></span>
        <button type="button" class="salir" id="btn-salir">
          <!-- Ícono "log-out" de Lucide (licencia ISC) -->
          <svg viewBox="0 0 24 24">
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          </svg>
          <span>Salir</span>
        </button>
        <span class="linea"></span>
      </div>
    </main>

    <!-- Mensaje flotante -->
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
